name: TestFlight

# Builds, signs, and uploads Hasta (with its widget extension) to
# TestFlight. Signing is cloud-managed through an App Store Connect API
# key and -allowProvisioningUpdates, so no certificates or profiles are
# stored in the repo.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   APP_STORE_CONNECT_KEY_ID       the API key's Key ID
#   APP_STORE_CONNECT_ISSUER_ID    the Issuer ID
#   APP_STORE_CONNECT_KEY_P8       the full contents of the .p8 file
#   APPLE_TEAM_ID                  the 10-character Developer Team ID

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version, like 1.0.1. Leave empty to use the version in project.yml.
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  upload:
    name: Build & upload to TestFlight
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 60
    concurrency:
      group: testflight
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Guard on secrets
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          [ -n "$KEY_ID" ] || missing+=(APP_STORE_CONNECT_KEY_ID)
          [ -n "$ISSUER_ID" ] || missing+=(APP_STORE_CONNECT_ISSUER_ID)
          [ -n "$KEY_P8" ] || missing+=(APP_STORE_CONNECT_KEY_P8)
          [ -n "$TEAM_ID" ] || missing+=(APPLE_TEAM_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - uses: ./.github/actions/xcode-project
        with:
          xcode: ${{ vars.XCODE_VERSION }}

      - name: Write App Store Connect API key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$KEY_P8" > ~/private_keys/AuthKey_${KEY_ID}.p8

      - name: Next build number
        id: buildnum
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          BUNDLE_ID: com.exaltedpixels.Hasta
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet PyJWT cryptography
          "$RUNNER_TEMP/asc-venv/bin/python" .github/scripts/testflight_next_build.py

      # The archive is signed ad hoc rather than left unsigned. Ad hoc
      # signing needs no certificate or device, but it embeds the
      # entitlements (the App Group) in the binaries, and the export step
      # carries embedded entitlements over when it re-signs for
      # distribution. An unsigned archive would lose the App Group.
      - name: Archive
        env:
          INPUT_VERSION: ${{ inputs.version || github.event.release.tag_name }}
          BUILD_NUMBER: ${{ steps.buildnum.outputs.build_number }}
        run: |
          set -o pipefail
          version="${INPUT_VERSION#v}"
          version="${version%%-*}"
          extra=()
          if [ -n "$version" ]; then
            extra+=("MARKETING_VERSION=$version")
          fi
          xcodebuild archive \
            -project Hasta.xcodeproj \
            -scheme Hasta \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Hasta.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER= \
            DEVELOPMENT_TEAM= \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${extra[@]}"

      - name: Check archive entitlements
        run: .github/scripts/check_entitlements.sh "$RUNNER_TEMP/Hasta.xcarchive/Products/Applications"

      - name: Export signed IPA
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          for destination in export upload; do
            cat > "$RUNNER_TEMP/ExportOptions-$destination.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$destination</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          done
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Hasta.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -allowProvisioningUpdates

      - name: Check signed entitlements
        run: |
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa"
          unzip -q "$RUNNER_TEMP"/export/*.ipa -d "$RUNNER_TEMP/ipa"
          .github/scripts/check_entitlements.sh "$RUNNER_TEMP/ipa/Payload"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Hasta.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" \
            -exportPath "$RUNNER_TEMP/upload" \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -allowProvisioningUpdates

      - name: Clean up API key
        if: always()
        run: rm -f ~/private_keys/AuthKey_*.p8
