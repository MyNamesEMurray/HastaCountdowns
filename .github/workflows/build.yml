name: Build

# Compiles the app, widget extension and tests for the iOS Simulator and
# runs the unit tests. Pushes to main are skipped: main only receives
# merges of branches that were already built.
on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - "**.md"
      - "AppStore/**"
      - "docs/**"
      - "site/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: Build & test
    # Set the MACOS_RUNNER repository variable to use a different runner
    # (for example a self-hosted Mac). Defaults to GitHub's macOS image.
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/xcode-project
        with:
          xcode: ${{ vars.XCODE_VERSION }}

      - name: Pick a simulator
        id: sim
        run: python3 .github/scripts/pick_simulator.py

      - name: Prepare simulator
        continue-on-error: true
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl status_bar "$SIMULATOR_ID" override \
            --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Build and test
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          FORMATTER=(cat)
          if command -v xcbeautify >/dev/null; then
            FORMATTER=(xcbeautify --renderer github-actions)
          fi
          xcodebuild test \
            -project Hasta.xcodeproj \
            -scheme Hasta \
            -destination "id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | "${FORMATTER[@]}"

      - name: Export screenshots
        if: success()
        continue-on-error: true
        run: python3 .github/scripts/export_screenshots.py TestResults.xcresult Screenshots

      - name: Compose App Store screenshots
        if: success()
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/venv/bin/python" .github/scripts/compose_app_store_screenshots.py Screenshots AppStoreScreenshots

      - name: Upload screenshots
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Screenshots
          path: Screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload App Store screenshots
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: AppStoreScreenshots
          path: AppStoreScreenshots
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
